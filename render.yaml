# Render Blueprint for the MediRemind API + PostgreSQL database.
#
# Usage: Render dashboard -> New -> Blueprint -> point at this repo.
# Secrets marked `sync: false` are prompted for in the Render UI and never
# committed to the repo.

databases:
  - name: mediremind-db
    databaseName: mediremind
    user: mediremind
    plan: free
    region: frankfurt

services:
  - type: web
    name: mediremind-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    # Build order matters:
    #  1. npm ci              - install everything, including devDependencies.
    #  2. db:use:postgres     - write schema.postgres.prisma from schema.prisma.
    #  3. db:generate:postgres- generate the Prisma client for that schema.
    #     MUST run before tsc: the server imports generated types (User, etc.).
    #  4. build -w server     - compile with tsc (needs @types/*, hence step 1).
    #  5. npm prune --omit=dev- drop devDependencies for a lean runtime image.
    #  6. db:push:postgres    - create tables (uses the prisma production dep).
    #
    # `db:use:postgres` runs on plain Node, not tsx, because devDependencies are
    # pruned partway through and are never present at runtime.
    buildCommand: >-
      npm ci &&
      npm run db:use:postgres -w server &&
      npm run db:generate:postgres -w server &&
      npm run build -w server &&
      npm prune --omit=dev &&
      npm run db:push:postgres -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Wired automatically from the managed database above.
      - key: DATABASE_URL
        fromDatabase:
          name: mediremind-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Set to your deployed client origin, e.g. https://mediremind.netlify.app
      - key: CORS_ORIGIN
        sync: false
      # Cross-domain cookies need SameSite=None; Secure.
      - key: COOKIE_SAME_SITE
        value: none
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
